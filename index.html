<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Ballon 3D - Frise chronologique</title>
<style>
  body { margin:0; background:#f2f2f2; display:flex; align-items:center; justify-content:center; height:100vh; font-family:Arial, sans-serif; }
  #container { width:500px; height:500px; }
</style>
</head>
<body>

<div id="container"></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { OBJLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/OBJLoader.js";

const container = document.getElementById("container");

// Scène
const scene = new THREE.Scene();

// Caméra
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(0, 0, 7.6);

// Rendu
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(500, 500);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lumières
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(4, 5, 6);
scene.add(key);

const fill = new THREE.DirectionalLight(0xffffff, 0.32);
fill.position.set(-5, 1, 3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.45);
rim.position.set(-3, -3, -5);
scene.add(rim);

const spec = new THREE.PointLight(0xffffff, 0.5, 20);
spec.position.set(2, 3, 5);
scene.add(spec);

// --- Texture générée dynamiquement (façon ballon avec texte) ---
function buildBallTexture(text1, text2, text3) {
  const canvas = document.createElement("canvas");
  canvas.width = 1024;
  canvas.height = 512;
  const ctx = canvas.getContext("2d");

  // fond blanc
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // bande rouge haut
  ctx.fillStyle = "#c8102e";
  ctx.fillRect(0, 0, canvas.width, 160);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 80px Arial";
  ctx.textAlign = "center";
  ctx.fillText(text1, canvas.width / 2, 110);

  // texte central noir
  ctx.fillStyle = "#101114";
  ctx.font = "bold 70px Arial";
  ctx.fillText(text2, canvas.width / 2, 300);

  // bande noire bas
  ctx.fillStyle = "#101114";
  ctx.fillRect(0, canvas.height - 160, canvas.width, 160);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 80px Arial";
  ctx.fillText(text3, canvas.width / 2, canvas.height - 50);

  return new THREE.CanvasTexture(canvas);
}

const texture = buildBallTexture("HISTORIQUE", "DU", "CLUB");

// --- Chargement du VRAI modèle 3D ---
const loader = new OBJLoader();
loader.load(
  "volleyball.obj",
  (object) => {
    object.traverse((child) => {
      if (child.isMesh) {
        child.material = new THREE.MeshStandardMaterial({
          map: texture,
          roughness: 0.5,
          metalness: 0.05
        });
      }
    });

    // Centrer et redimensionner automatiquement le modèle
    const box = new THREE.Box3().setFromObject(object);
    const size = new THREE.Vector3();
    box.getSize(size);
    const center = new THREE.Vector3();
    box.getCenter(center);

    object.position.sub(center); // centre le modèle à l'origine

    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 2 / maxDim; // ajuste la taille pour qu'il fasse environ 2 unités
    object.scale.setScalar(scale);

    scene.add(object);
  },
  (xhr) => {
    console.log((xhr.loaded / xhr.total * 100).toFixed(0) + "% chargé");
  },
  (error) => {
    console.error("Erreur de chargement du modèle :", error);
  }
);

// Contrôles souris
const controls = new OrbitControls(camera, renderer.domElement);
controls.autoRotate = true;
controls.autoRotateSpeed = 2;
controls.enableDamping = true;

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
