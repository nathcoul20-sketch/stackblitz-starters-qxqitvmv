name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ScoreCast-apk
          path: android/app/build/outputs/apk/release/*.apk

      # Lien de téléchargement direct (page « Releases » du dépôt), plus simple depuis un téléphone
      - name: Publier l'APK (release scorecast)
        if: github.ref == 'refs/heads/claude/scorecast'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk ScoreCast.apk
          gh release view scorecast >/dev/null 2>&1 || gh release create scorecast --target "$GITHUB_SHA" --prerelease \
            --title "ScoreCast — live multisport" --notes "APK de l'appli ScoreCast (foot, volley, basket, hand). Sur le téléphone : télécharger ScoreCast.apk, l'ouvrir, autoriser l'installation."
          gh release upload scorecast ScoreCast.apk --clobber
